name: deploy

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "admin/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "pet-feeding-web/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "api_image=${repo}:${GITHUB_SHA}"
            echo "api_tags=${repo}:${GITHUB_SHA},${repo}:latest"
            echo "web_image=${repo}/web:${GITHUB_SHA}"
            echo "web_tags=${repo}/web:${GITHUB_SHA},${repo}/web:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./pet-feeding-web
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://homepet.cn
            NEXT_PUBLIC_API_BASE_URL=
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Runner can reach GitHub; ECS in China often cannot. Sync deploy configs over SSH
      # instead of `git fetch` on the server.
      - uses: actions/checkout@v5

      - name: Ensure deploy directory on ECS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 2m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/zoo-go}"
            mkdir -p "$DEPLOY_PATH/deploy" "$DEPLOY_PATH/data" "$DEPLOY_PATH/secrets"

      - name: Sync deploy configs to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "deploy/Caddyfile,deploy/deploy.sh,deploy/docker-compose.yml,deploy/.env.example"
          target: ${{ secrets.DEPLOY_PATH }}/deploy
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # Fail hung SSH / remote docker pulls instead of blocking deploy-production.
          command_timeout: 20m
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_USER,WECHAT_APP_ID,WECHAT_APP_SECRET,API_IMAGE,WEB_IMAGE
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/zoo-go}"
            cd "$DEPLOY_PATH"
            chmod +x ./deploy/deploy.sh
            if [[ -z "${WECHAT_APP_ID:-}" || -z "${WECHAT_APP_SECRET:-}" ]]; then
              echo "missing WECHAT_APP_ID or WECHAT_APP_SECRET GitHub secret" >&2
              exit 1
            fi
            env_file="$DEPLOY_PATH/deploy/.env"
            if [[ ! -f "$env_file" ]]; then
              echo "missing $env_file — copy deploy/.env.example to deploy/.env on the host and fill secrets" >&2
              exit 1
            fi
            set_env() {
              local key="$1"
              local value="$2"
              if grep -Eq "^${key}=" "$env_file"; then
                sed -i.bak "s|^${key}=.*|${key}=${value}|" "$env_file"
                rm -f "$env_file.bak"
              else
                printf '\n%s=%s\n' "$key" "$value" >> "$env_file"
              fi
            }
            set_env WECHAT_APP_ID "$WECHAT_APP_ID"
            set_env WECHAT_APP_SECRET "$WECHAT_APP_SECRET"
            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-$USER}" --password-stdin
            fi
            ./deploy/deploy.sh "$API_IMAGE" "$WEB_IMAGE"
