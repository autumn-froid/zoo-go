name: lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"
  # Always run on PRs so the required "golangci-lint" check reports a status
  # even when the PR has no Go changes (path filters would leave it pending).
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            go:
              - "**/*.go"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - ".github/workflows/lint.yml"

      - name: Skip (no Go changes)
        if: steps.changes.outputs.go != 'true'
        run: echo "No Go-related changes; reporting success for required check."

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod

      - name: golangci-lint
        if: steps.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
