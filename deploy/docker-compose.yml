services:
  api:
    image: ${ZOO_IMAGE:-ghcr.io/connor-wj-kang/zoo-go:latest}
    container_name: zoo-api
    restart: unless-stopped
    depends_on:
      - openobserve
    # Host loopback only — public traffic goes through Caddy on :443.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DATA_FILE: /app/data/zoo.db
      UPLOAD_DIR: /app/data/uploads
      ADMIN_DIR: /app/admin
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    volumes:
      - ../data:/app/data
      - ../secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-ghcr.io/connor-wj-kang/zoo-go/web:latest}
    container_name: zoo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side sitemap/robots/metadata fallback (client values are baked at image build).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homepet.cn}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    container_name: zoo-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy/data:/data
      - ../data/caddy/config:/config

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:${O2_PORT:-5080}:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_USER:?set O2_USER in deploy/.env}
      ZO_ROOT_USER_PASSWORD: ${O2_PASS:?set O2_PASS in deploy/.env}
      ZO_DATA_DIR: /data
    volumes:
      - ../data/openobserve:/data
